packages:
  - packages/*
allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
  keytar: true
  '@vscode/vsce-sign': true
  '@parcel/watcher': false
minimumReleaseAgeExclude:
  - '@clidoc/core@1.1.2'
  - '@clidoc/yargs@1.1.2'
  - '@clidoc/docusaurus@1.1.2'
  - humanize-units@2.1.0

overrides:
  serialize-javascript: ^7.0.3
  source-map-js: ^1.2.2
  tinypool: ^2.1.2
